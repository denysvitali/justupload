# fly.toml app configuration file for justupload
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'justupload'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  UPLOAD_DIR = '/data/uploads'
  RUST_LOG = 'info,tower_http=info'

# Files are indexed in memory, so this app must never run on more than one
# machine. Keep the count at 1 (`fly scale count 1`).
[mounts]
  source = 'justupload_data'
  destination = '/data'
  initial_size = '5gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
